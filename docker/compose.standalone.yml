name: sso-yado

# Standalone: self-contained (needs no external network like Traefik), uses
# Caddy as the reverse proxy. The same single file serves two scenarios:
#
#   - Local testing/use:     CADDY_SITE_ADDRESS=http://localhost (default)  -> visit http://localhost
#   - Public deploy:        CADDY_SITE_ADDRESS=sso.yourdomain.com          -> Caddy automatically provisions
#                            HTTPS via Let's Encrypt, no manual setup needed
#
# IMPORTANT: do NOT put a port in CADDY_SITE_ADDRESS (e.g. "http://localhost:8080") if
# HTTP_PORT has been changed from the default 80 - Caddy will listen on the port named INSIDE
# that address (so 8080 inside the container), while the HTTP_PORT mapping still
# points to the container's port 80. Change the host port through HTTP_PORT/HTTPS_PORT only,
# and leave CADDY_SITE_ADDRESS without a port.
#
# Usage: make docker-standalone-deploy (or manually: docker compose -f
# docker/compose.standalone.yml --project-directory . up -d --build - the
# --project-directory flag is REQUIRED so that all relative paths in this file still resolve to
# the repo root, not the docker/ folder)

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    volumes:
      - sso_storage:/var/www/html/storage
      - sso_public:/var/www/html/public
      - ./.env:/var/www/html/.env
    env_file: .env
    environment:
      # This project uses a read/write split (see config/database.php) - DB_HOST alone
      # is not enough, an explicit DB_READ_HOST/DB_WRITE_HOST in .env would win over
      # the DB_HOST fallback if not overridden here as well.
      DB_HOST: postgres
      DB_READ_HOST: postgres
      DB_WRITE_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sso

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-http://localhost}
    volumes:
      - sso_public:/var/www/html/public:ro
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - sso

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Unlike MySQL: the official Postgres image has no separate root+user concept,
      # only 1 superuser is created from POSTGRES_USER/POSTGRES_PASSWORD - so this
      # MUST match the DB_USERNAME/DB_PASSWORD used by the application exactly.
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: db_sso
    volumes:
      - sso_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sso

volumes:
  sso_postgres_data:
  sso_storage:
  sso_public:
  caddy_data:
  caddy_config:

networks:
  sso:
    name: yado_sso_standalone
