name: sso-yado

# Production compose for the homelab (Proxmox + many Docker projects on one host).
# Differences from docker-compose.yml (dev):
#   - Does not mount source code - the code is baked into the image at build time
#   - Joins the external "proxy" network (Traefik) instead of exposing ports directly
#   - restart: unless-stopped + healthcheck
#   - migrate (not migrate:fresh) on update - data must not be lost
#
# Usage: make docker-prod-deploy (or manually: docker compose -f docker/compose.prod.yml
# --project-directory . up -d --build - the --project-directory flag is REQUIRED so that all
# relative paths in this file still resolve to the repo root, not the docker/ folder)

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    volumes:
      - sso_storage:/var/www/html/storage
      - sso_public:/var/www/html/public
      - ./.env:/var/www/html/.env
    env_file: .env
    environment:
      # This project uses a read/write split (see config/database.php) - DB_HOST alone
      # is not enough, an explicit DB_READ_HOST/DB_WRITE_HOST in .env would win over
      # the DB_HOST fallback if not overridden here as well.
      DB_HOST: postgres
      DB_READ_HOST: postgres
      DB_WRITE_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sso
      - proxy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - sso_public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - sso
      - proxy
    labels:
      # Traefik v2/v3 - adjust Host() and the certresolver to match your Traefik setup
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.sso.rule=Host(`sso.yado.my.id`)"
      - "traefik.http.routers.sso.entrypoints=websecure"
      - "traefik.http.routers.sso.tls.certresolver=letsencrypt"
      - "traefik.http.services.sso.loadbalancer.server.port=80"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Unlike MySQL: the official Postgres image has no separate root+user concept,
      # only 1 superuser is created from POSTGRES_USER/POSTGRES_PASSWORD - so this
      # MUST match the DB_USERNAME/DB_PASSWORD used by the application exactly.
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: db_sso
    volumes:
      - sso_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sso

volumes:
  sso_postgres_data:
  sso_storage:
  sso_public:

networks:
  sso:
    name: yado_sso_prod
  proxy:
    external: true
    name: proxy
