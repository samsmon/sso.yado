name: sso-yado

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./storage:/var/www/html/storage
      - ./.env:/var/www/html/.env
      - sso_public:/var/www/html/public
    environment:
      # This project uses a read/write split (see config/database.php) - DB_HOST alone
      # is not enough, an explicit DB_READ_HOST/DB_WRITE_HOST in .env would win over
      # the DB_HOST fallback if not overridden here as well.
      DB_HOST: postgres
      DB_READ_HOST: postgres
      DB_WRITE_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sso

  nginx:
    image: nginx:alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - sso_public:/var/www/html/public:ro
      - ./storage:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - sso

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: db_sso
      POSTGRES_USER: postgres
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - sso_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sso

volumes:
  sso_postgres_data:
  sso_public:

networks:
  sso:
    name: yado_sso
